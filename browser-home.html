<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LUMI</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700&family=Courier+Prime&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/index.css">

</head>


<body>


<!-- =====================================================
     顶部导航
===================================================== -->

<header class="topbar">

    <div class="topbar-left">
        <a class="top-link">新闻</a>
        <a class="top-link">图片</a>
        <a class="top-link">视频</a>
        <a class="top-link">地图</a>
    </div>

    <div class="topbar-right">
        <span class="sync-note">已同步</span>
        <a href="mengqi-social.html" class="my-link">我的</a>
        <a href="mengqi-social.html" class="avatar-link">
            <div class="avatar">梦</div>
        </a>
    </div>

</header>


<!-- =====================================================
     中央区域
===================================================== -->

<main class="search-main">


    <!-- Logo -->

    <div class="logo">
        LUMI
        <span>星迹</span>
    </div>


    <!-- 搜索框 -->

    <div class="search-wrap">

        <div class="search-box">

            <svg
                class="search-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>

            <input
                type="text"
                id="searchInput"
                placeholder="搜索 LUMI，或输入网址"
                autocomplete="off">

            <button class="clear-btn" id="clearBtn">×</button>

        </div>

        <!-- 下拉记录（默认隐藏） -->
        <div class="suggest" id="suggestBox">

            <!-- 最近搜索 -->
            <div class="suggest-label">最近搜索</div>

            <div class="suggest-item" data-keyword="新生女孩论坛">
                <span class="suggest-time">🕒</span>
                <span>新生女孩论坛</span>
            </div>

            <div class="suggest-item" data-keyword="玉兰阁官网">
                <span class="suggest-time">🕒</span>
                <span>玉兰阁官网</span>
            </div>

            <div class="suggest-item" data-keyword="新生计划 训练内容">
                <span class="suggest-time">🕒</span>
                <span>新生计划 训练内容</span>
            </div>

            <div class="suggest-item" data-keyword="星星耳钉 香港哪里有卖">
                <span class="suggest-time">🕒</span>
                <span>星星耳钉 香港哪里有卖</span>
            </div>

            <div class="suggest-item" data-keyword="整容 削骨 恢复期">
                <span class="suggest-time">🕒</span>
                <span>整容 削骨 恢复期</span>
            </div>

            <div class="suggest-item" data-keyword="血液整容 安全吗">
                <span class="suggest-time">🕒</span>
                <span>血液整容 安全吗</span>
            </div>

            <div class="suggest-item" data-keyword="睡不着怎么办">
                <span class="suggest-time">🕒</span>
                <span>睡不着怎么办</span>
            </div>

            <div class="suggest-item" data-keyword="天使灵数 17">
                <span class="suggest-time">🕒</span>
                <span>天使灵数 17</span>
            </div>

            <!-- 分隔线 -->
            <div class="suggest-divider"></div>

            <!-- 热搜榜 -->
            <div class="suggest-label hot-label">🔥 热搜</div>

            <div class="suggest-item hot-item" data-keyword="香港街头多名少女撞脸">
                <span class="hot-rank rank-1">1</span>
                <span>香港街头多名少女撞脸 医生：像同一模板</span>
            </div>

            <div class="suggest-item hot-item" data-keyword="整容模板化 撞脸率激增">
                <span class="hot-rank rank-2">2</span>
                <span>整容模板化失控 撞脸率激增</span>
            </div>

            <div class="suggest-item hot-item" data-keyword="陈梦琪失踪案最新进展">
                <span class="hot-rank rank-3">3</span>
                <span>陈梦琪失踪案最新进展 警方回应</span>
            </div>

            <div class="suggest-item hot-item" data-keyword="千人一面 整容内幕">
                <span class="hot-rank">4</span>
                <span>千人一面 整容诊所不愿说的秘密</span>
            </div>

            <div class="suggest-item hot-item" data-keyword="消失的小偶像">
                <span class="hot-rank">5</span>
                <span>消失的小偶像 粉丝苦等48日</span>
            </div>

        </div>

    </div>


    <!-- 搜索按钮 -->

    <div class="search-buttons">
        <button class="btn-primary" onclick="doSearch()">搜索</button>
        <button class="btn-secondary">手气不错</button>
    </div>


    <!-- 文字链接 -->

    <p class="hint-text">
        搜索记录只存在本机，最多保留 30 天。
        <a>管理记录</a>
    </p>

</main>


<!-- =====================================================
     页脚
===================================================== -->

<footer class="footer">

    <div class="footer-links">
        <a>帮助</a>
        <a>隐私</a>
        <a>条款</a>
        <a>设置</a>
    </div>

    <p>
        上次同步：2026.02.16 23:47
    </p>

</footer>


<script>

/* ========== 元素 ========== */

const searchInput = document.getElementById("searchInput");
const suggestBox = document.getElementById("suggestBox");
const clearBtn = document.getElementById("clearBtn");


/* ========== 初始状态 ========== */

clearBtn.style.display = "none";
suggestBox.style.display = "none";


/* ========== 点击搜索框显示下拉 ========== */

searchInput.addEventListener("click", function () {
    suggestBox.style.display = "block";
});


/* ========== 点击空白区域关闭下拉 ========== */

document.addEventListener("click", function (event) {
    if (!event.target.closest(".search-wrap")) {
        suggestBox.style.display = "none";
    }
});


/* ========== 点击下拉记录填入搜索框 ========== */

document.querySelectorAll(".suggest-item").forEach(function (item) {
    item.addEventListener("click", function () {
        searchInput.value = item.getAttribute("data-keyword");
        clearBtn.style.display = "block";
        suggestBox.style.display = "none";
        searchInput.focus();
    });
});


/* ========== 清除按钮 ========== */

clearBtn.addEventListener("click", function () {
    searchInput.value = "";
    searchInput.placeholder = "搜索 LUMI，或输入网址";
    clearBtn.style.display = "none";
    searchInput.focus();
    suggestBox.style.display = "block";
});


/* ========== 输入时显示清除按钮 ========== */

searchInput.addEventListener("input", function () {
    if (searchInput.value.length > 0) {
        clearBtn.style.display = "block";
    } else {
        clearBtn.style.display = "none";
    }
});


/* =====================================================
   执行搜索：跳转到搜索结果页
===================================================== */

function doSearch() {

    const keyword = searchInput.value.trim();

    if (keyword === "") {
        searchInput.placeholder = "请输入搜索内容";
        searchInput.focus();
        suggestBox.style.display = "none";
        return;
    }

    /* 跳转到搜索结果页，携带关键词 */
    window.location.href =
        "search-results.html?q=" + encodeURIComponent(keyword);

}


/* ========== 回车搜索 ========== */

searchInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        doSearch();
    }
});

</script>


</body>

</html>
