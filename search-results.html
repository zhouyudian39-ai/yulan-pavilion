/* =====================================================
   搜索逻辑
===================================================== */

function getKeywordFromURL() {

    const params = new URLSearchParams(window.location.search);
    return params.get("q") || "";

}


function doSearch() {

    const keyword =
        document.getElementById("headerSearchInput").value.trim();

    if (keyword === "") {
        return;
    }

    window.location.href =
        "search-results.html?q=" + encodeURIComponent(keyword);

}


function doHeaderSearch() {
    doSearch();
}


/* =====================================================
   查询分词与相关度评分
   —— 原实现按 resultDatabase 顺序做 first-match-wins，
      组合关键词（如「玉兰阁 招标」「陈梦琪 学校」）
      永远只能命中排在最前面的区块。
      这里改为：对每个区块独立评分，全部命中区块一起返回。
===================================================== */

function normalizeSearchText(value) {

    return String(value === undefined || value === null ? "" : value)
        .toLowerCase()
        .replace(/[\s\u3000]+/g, " ")
        .trim();

}


/* 把查询拆成词元：整串优先，同时保留按空格拆开的每个词 */

function buildQueryTokens(keyword) {

    const normalized = normalizeSearchText(keyword);

    if (normalized === "") {
        return [];
    }

    const tokens = [];

    normalized.split(" ").forEach(function (part) {
        if (part !== "" && tokens.indexOf(part) === -1) {
            tokens.push(part);
        }
    });

    return tokens;

}


/* 单个区块的得分
   - 完全等于关键词        100
   - 以关键词开头          70 + 关键词长度
   - 包含关键词            50 + 关键词长度
   - 越靠后的限定词权重越高（后一个词通常是在收窄范围），
     所以「玉兰阁 招标」会优先给出「招标公示」，
     「陈梦琪 学校」会优先给出与学校相关的报道。 */

function scoreResultBlock(block, tokens) {

    let total = 0;
    let hits = 0;
    let longest = 0;

    tokens.forEach(function (token, tokenIndex) {

        let best = 0;
        let bestKeyword = "";

        block.keywords.forEach(function (keyword) {

            const k = normalizeSearchText(keyword);

            if (k === "") {
                return;
            }

            let quality = 0;

            if (token === k) {
                quality = 100;
            } else if (token.indexOf(k) === 0) {
                quality = 70 + k.length;
            } else if (token.indexOf(k) !== -1) {
                quality = 50 + k.length;
            }

            if (quality > best) {
                best = quality;
                bestKeyword = k;
            }

        });

        if (best > 0) {

            total += best * (1 + tokenIndex * 0.5);
            hits += 1;

            if (bestKeyword.length > longest) {
                longest = bestKeyword.length;
            }

        }

    });

    return {
        total: total,
        hits: hits,
        longest: longest
    };

}


function displayResults() {

    const keyword = getKeywordFromURL();

    if (keyword === "") {

        document.getElementById("resultsCount").textContent =
            "请输入搜索内容";

        document.getElementById("resultsList").innerHTML = "";

        document.getElementById("relatedSearches").style.display = "none";

        return;

    }


    document.getElementById("headerSearchInput").value = keyword;


    /* 特殊关键词处理 */

    if (keyword.includes("0217") || keyword === "02:17") {

        document.body.classList.add("glitch-body");

        setTimeout(function () {
            document.body.classList.remove("glitch-body");
        }, 500);

        document.getElementById("resultsCount").textContent =
            "搜索「" + keyword + "」· 无结果";

        document.getElementById("resultsList").innerHTML = `
            <div class="search-result-item">
                <p class="no-results">未找到与「${keyword}」相关的公开资料。</p>
                <p class="no-results-sub">该关键词可能涉及内部信息。</p>
            </div>
        `;

        document.getElementById("relatedSearches").style.display = "none";

        return;

    }


    if (keyword.includes("LYL") || keyword.includes("林玉兰账号")) {

        document.getElementById("resultsCount").textContent =
            "搜索「" + keyword + "」· 1条结果";

        document.getElementById("resultsList").innerHTML = `
            <div class="search-result-item locked-result">
                <div class="result-url">yulanpavilion.hk/internal/lyl</div>
                <span class="result-title no-link">访问受限</span>
                <p class="result-desc">该账号需要 FOUNDER 权限。</p>
                <p class="result-locked-note">🔒 已锁定</p>
            </div>
        `;

        document.getElementById("relatedSearches").style.display = "none";

        return;

    }


    /* =================================================
       匹配结果
       —— 收集所有命中的区块，而不是只取第一个
       （原实现 first-match-wins：
        「玉兰阁 招标」只会命中「玉兰阁」区块，「招标公示」永远搜不到）
    ================================================= */

    const tokens = buildQueryTokens(keyword);

    const matchedBlocks = [];

    resultDatabase.forEach(function (item, index) {

        const score = scoreResultBlock(item, tokens);

        if (score.total > 0) {
            score.order = index;
            matchedBlocks.push({ block: item, score: score, order: index });
        }

    });


    /* 相关度排序：总分 → 命中词元数 → 最长关键词 → 原始顺序 */

    matchedBlocks.sort(function (a, b) {

        if (b.score.total !== a.score.total) {
            return b.score.total - a.score.total;
        }

        if (b.score.hits !== a.score.hits) {
            return b.score.hits - a.score.hits;
        }

        if (b.score.longest !== a.score.longest) {
            return b.score.longest - a.score.longest;
        }

        return a.order - b.order;

    });


    if (matchedBlocks.length === 0) {

        document.getElementById("resultsCount").textContent =
            "未找到与「" + keyword + "」相关的结果。";

        document.getElementById("resultsList").innerHTML = `
            <div class="no-results">
                <p>请尝试其他关键词。</p>
            </div>
        `;

        document.getElementById("relatedSearches").style.display = "none";

        return;

    }


    /* =================================================
       合并所有区块的结果（同一标题 + 链接只保留一次）
    ================================================= */

    const mergedResults = [];
    const seenResultKeys = {};

    matchedBlocks.forEach(function (entry) {

        entry.block.results.forEach(function (result) {

            const resultKey = result.title + "|" + (result.url || "");

            if (seenResultKeys[resultKey]) {
                return;
            }

            seenResultKeys[resultKey] = true;
            mergedResults.push(result);

        });

    });


    document.getElementById("resultsCount").textContent =
        "找到约 " + mergedResults.length + " 条结果";


    let resultsHTML = "";

    mergedResults.forEach(function (result) {

        if (result.special === "phoenix-glitch") {

            resultsHTML += `
                <div class="search-result-item">
                    <div class="result-url">${result.showUrl}</div>
                    <span class="result-title no-link">凤█</span>
                    <p class="result-desc">正在访问…</p>
                </div>
            `;

            /* 延迟跳转 */
            setTimeout(function () {
                window.location.href = "phoenix.html";
            }, 1500);

            return;

        }

        if (result.special === "locked") {

            /* 已解锁：直接作为普通结果呈现
               （"founder_access" 与 js/game-progress.js 中
                 GAME_FLAGS.founderAccess 的值一致，这里用字面量
                 以免依赖脚本加载顺序） */
            if (typeof isProgressUnlocked === "function" &&
                isProgressUnlocked("founder_access")) {

                resultsHTML += `
                    <div class="search-result-item">
                        <div class="result-url">${result.showUrl}</div>
                        <a href="${result.url}" class="result-title">${result.title}</a>
                        <p class="result-desc">${result.desc}</p>
                        <p class="result-locked-note result-unlocked-note">🔓 权限已验证</p>
                    </div>
                `;

                return;

            }

            /* 未解锁：仍然可点击，由目标页面给出访问提示与线索方向 */
            resultsHTML += `
                <div class="search-result-item locked-result">
                    <div class="result-url">${result.showUrl}</div>
                    <a href="${result.url}" class="result-title locked-title">${result.title}</a>
                    <p class="result-desc">${result.desc}</p>
                    <p class="result-locked-note">🔒 需要 FOUNDER 权限 · 点击验证身份</p>
                </div>
            `;

            return;

        }

        resultsHTML += `
            <div class="search-result-item">

                <div class="result-url">
                    ${result.showUrl}
                </div>

                ${result.url !== "#" ?
                    `<a href="${result.url}" class="result-title">${result.title}</a>` :
                    `<span class="result-title no-link">${result.title}</span>`
                }

                <p class="result-desc">${result.desc}</p>

            </div>
        `;

    });

    document.getElementById("resultsList").innerHTML = resultsHTML;


    /* =================================================
       相关搜索：合并所有命中区块的建议并去重
    ================================================= */

    const relatedList = [];
    const seenRelated = {};

    matchedBlocks.forEach(function (entry) {

        (entry.block.related || []).forEach(function (rel) {

            if (seenRelated[rel]) {
                return;
            }

            seenRelated[rel] = true;
            relatedList.push(rel);

        });

    });


    if (relatedList.length > 0) {

        let relatedHTML = "<span>相关搜索：</span>";

        relatedList.slice(0, 10).forEach(function (rel) {

            relatedHTML += `
                <a href="search-results.html?q=${encodeURIComponent(rel)}">
                    ${rel}
                </a>
            `;

        });

        document.getElementById("relatedSearches").innerHTML = relatedHTML;
        document.getElementById("relatedSearches").style.display = "flex";

    } else {

        document.getElementById("relatedSearches").style.display = "none";

    }

}


document.getElementById("headerSearchInput").addEventListener(
    "keydown",
    function (event) {
        if (event.key === "Enter") {
            doSearch();
        }
    }
);


document.addEventListener("DOMContentLoaded", function () {
    displayResults();
});

</script>
